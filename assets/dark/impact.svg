<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Impact at a glance</title>
<desc id="desc">4.5+ years in data (BSc in Business Intelligence plus four data roles); 20+ Power BI dashboards scaled from four; a 25-table semantic model; 25,000+ SKU-store combinations across 300+ stores; reporting prep cut from hours to minutes with Python ETL; BI work across Mexico, France and Spain; two open-source Power BI custom visuals shipped.</desc>
<style>.tile{animation:rise .8s cubic-bezier(.2,.8,.3,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
.seg{transform-box:fill-box;transform-origin:left;animation:grow-x .9s cubic-bezier(.2,.8,.3,1) both}
.s1{animation-delay:.5s}.s2{animation-delay:.8s}.s3{animation-delay:1.1s}.s4{animation-delay:1.4s}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow-y 1s cubic-bezier(.2,.8,.3,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.glow{animation:glow 3.2s ease-in-out infinite}
.edge{stroke-dasharray:4 5;animation:flow 1.2s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.25);opacity:1}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-18}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><linearGradient id="num" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#8bd5ff"/></linearGradient><linearGradient id="barg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1d5f98"/><stop offset="1" stop-color="#8bd5ff"/></linearGradient></defs>
<g transform="translate(0 0)"><g class="tile "><rect x="1" y="1" width="468" height="210" rx="16" fill="#0b1f3f" stroke="#1f3a66"/><rect class="glow" x="28" y="27" width="26" height="5" rx="2.5" fill="#39d353"/><text x="64" y="33" font-size="12.5" font-weight="700" letter-spacing="1.3" fill="#7e93b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">YEARS IN DATA</text><text x="26" y="104" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#num)">4.5+</text><text x="176" y="78" font-size="21" font-weight="700" fill="#f2f6fb">years in data</text><text x="176" y="102" font-size="15" font-weight="500" fill="#9aaecc">BI degree + 4 data roles</text><rect class="seg s1" x="28.0" y="150" width="157.7" height="12" rx="6" fill="#1d5f98"/><rect class="seg s2" x="188.7" y="150" width="42.3" height="12" rx="6" fill="#8bd5ff"/><rect class="seg s3" x="234.0" y="150" width="42.3" height="12" rx="6" fill="#62b0ef"/><rect class="seg s4" x="279.3" y="150" width="157.7" height="12" rx="6" fill="#39d353"/><text x="28" y="186" font-size="13" fill="#9aaecc">BSc in BI</text><text x="189" y="186" font-size="13" fill="#9aaecc">SEB</text><text x="234" y="186" font-size="13" fill="#9aaecc">LIV·EGADE</text><text x="358" y="186" font-size="13" font-weight="700" fill="#f2f6fb" text-anchor="middle">LVMH</text><text x="440" y="186" font-size="13" fill="#9aaecc" text-anchor="end">now</text><circle class="pulse" cx="436" cy="156" r="7" fill="#39d353"/><text x="189" y="140" font-size="12" fill="#7e93b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">2024</text></g></g>
