<g transform="translate(724 0)"><g class="tile d2"><rect x="1" y="1" width="234" height="210" rx="16" fill="#0b1f3f" stroke="#1f3a66"/><rect class="glow" x="24" y="27" width="26" height="5" rx="2.5" fill="#8bd5ff"/><text x="60" y="33" font-size="12.5" font-weight="700" letter-spacing="1.3" fill="#7e93b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">DATA MODEL</text><text x="22" y="104" font-size="56" font-weight="800" letter-spacing="-1.5" fill="url(#num)">25</text><text x="24" y="132" font-size="16" font-weight="700" fill="#f2f6fb">table semantic</text><text x="24" y="154" font-size="16" font-weight="700" fill="#f2f6fb">model</text><text x="24" y="180" font-size="13.5" font-weight="500" fill="#9aaecc">sell-out → quotas</text><line class="edge" x1="180" y1="150" x2="180" y2="120" stroke="#62b0ef" stroke-width="1.6"/><line class="edge" x1="180" y1="150" x2="212" y2="150" stroke="#62b0ef" stroke-width="1.6"/><line class="edge" x1="180" y1="150" x2="180" y2="180" stroke="#62b0ef" stroke-width="1.6"/><line class="edge" x1="180" y1="150" x2="148" y2="150" stroke="#62b0ef" stroke-width="1.6"/><rect x="169" y="112" width="22" height="16" rx="4" fill="#071a36" stroke="#1f3a66"/><rect x="201" y="142" width="22" height="16" rx="4" fill="#071a36" stroke="#1f3a66"/><rect x="169" y="172" width="22" height="16" rx="4" fill="#071a36" stroke="#1f3a66"/><rect x="137" y="142" width="22" height="16" rx="4" fill="#071a36" stroke="#1f3a66"/><rect x="167" y="141" width="26" height="18" rx="4" fill="#62b0ef"/></g></g>
<g transform="translate(0 224)"><g class="tile d3"><rect x="1" y="1" width="229" height="154" rx="16" fill="#0b1f3f" stroke="#1f3a66"/><rect class="glow" x="24" y="25" width="26" height="5" rx="2.5" fill="#39d353"/><text x="60" y="31" font-size="12.5" font-weight="700" letter-spacing="1.3" fill="#7e93b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">CPFR</text><text x="22" y="96" font-size="48" font-weight="800" letter-spacing="-1.5" fill="url(#num)">25K+</text><text x="24" y="122" font-size="14.5" font-weight="700" fill="#f2f6fb">SKU–store combinations</text><text x="24" y="142" font-size="13.5" font-weight="500" fill="#9aaecc">across 300+ stores</text></g></g>
<g transform="translate(243 224)"><g class="tile d4"><rect x="1" y="1" width="229" height="154" rx="16" fill="#0b1f3f" stroke="#1f3a66"/><rect class="glow" x="24" y="25" width="26" height="5" rx="2.5" fill="#62b0ef"/><text x="60" y="31" font-size="12.5" font-weight="700" letter-spacing="1.3" fill="#7e93b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">AUTOMATION</text><text x="22" y="96" font-size="48" font-weight="800" letter-spacing="-1.5" fill="url(#num)">h<tspan fill="#39d353">→</tspan>min</text><text x="24" y="122" font-size="15" font-weight="700" fill="#f2f6fb">reporting prep time</text><text x="24" y="142" font-size="13.5" font-weight="500" fill="#9aaecc">with Python ETL</text></g></g>
<g transform="translate(486 224)"><g class="tile d5"><rect x="1" y="1" width="229" height="154" rx="16" fill="#0b1f3f" stroke="#1f3a66"/><rect class="glow" x="24" y="25" width="26" height="5" rx="2.5" fill="#8bd5ff"/><text x="60" y="31" font-size="12.5" font-weight="700" letter-spacing="1.3" fill="#7e93b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">MARKETS</text><text x="22" y="96" font-size="48" font-weight="800" letter-spacing="-1.5" fill="url(#num)">3</text><text x="58" y="96" font-size="20" font-weight="700" fill="#f2f6fb">countries</text><text x="24" y="122" font-size="15" font-weight="700" fill="#f2f6fb">Mexico · France · Spain</text><text x="24" y="142" font-size="13.5" font-weight="500" fill="#9aaecc">remote and on-site BI</text></g></g>
