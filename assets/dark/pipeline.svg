<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 224" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How I build data products</title>
<desc id="desc">Five stages: raw sources; Python ETL with data-quality checks; a semantic model in DAX and TMDL versioned as PBIP in Git; Power BI with governed KPIs; and an AI layer of agents, skills and MCP.</desc>
<style>
.rise{animation:rise .8s cubic-bezier(.2,.8,.3,1) both}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.65}50%{transform:scale(1.15);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<path class="flow" d="M96 122 H864" stroke="#62b0ef" stroke-width="2" fill="none" opacity=".75"/>
<circle r="5" fill="#39d353" opacity="0"><animateMotion dur="4.2s" begin="0.0s" repeatCount="indefinite" path="M96 122 H864"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4.2s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#39d353" opacity="0"><animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite" path="M96 122 H864"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4.2s" begin="1.4s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#39d353" opacity="0"><animateMotion dur="4.2s" begin="2.8s" repeatCount="indefinite" path="M96 122 H864"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4.2s" begin="2.8s" repeatCount="indefinite"/></circle>
<g transform="translate(0 0)"><g class="rise" style="animation-delay:0.00s">
<rect x="1" y="20" width="182" height="200" rx="14" fill="#0b1f3f" stroke="#1f3a66" stroke-width="1"/>
