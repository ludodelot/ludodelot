<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 170" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Selected impact</title>
<desc id="desc">20+ Power BI dashboards scaled from four; a 25-table semantic model; 25,000+ SKU-store combinations analyzed across 300+ stores; reporting prep cut from hours to minutes with Python ETL.</desc>
<style>.tile{animation:rise .8s cubic-bezier(.2,.8,.3,1) both}.t1{animation-delay:.15s}.t2{animation-delay:.3s}.t3{animation-delay:.45s}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><linearGradient id="num" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1f3f"/><stop offset="1" stop-color="#0969da"/></linearGradient></defs>
<g transform="translate(0 0)"><g class="tile t0">
<rect x="1" y="1" width="234" height="168" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect class="glow" x="24" y="24" width="34" height="5" rx="2.5" fill="#1a7f37"/>
<text x="22" y="94" font-size="50" font-weight="800" fill="url(#num)" letter-spacing="-1">20+</text>
<text x="24" y="126" font-size="17" font-weight="700" fill="#1f2328">Power BI dashboards</text>
<text x="24" y="150" font-size="14.5" fill="#59636e">scaled from 4 · shared KPIs</text>
</g></g>
<g transform="translate(242 0)"><g class="tile t1">
<rect x="1" y="1" width="234" height="168" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect class="glow" x="24" y="24" width="34" height="5" rx="2.5" fill="#0969da"/>
<text x="22" y="94" font-size="50" font-weight="800" fill="url(#num)" letter-spacing="-1">25</text>
<text x="24" y="126" font-size="17" font-weight="700" fill="#1f2328">table semantic model</text>
<text x="24" y="150" font-size="14.5" fill="#59636e">sell-out → stock → quotas</text>
</g></g>
<g transform="translate(484 0)"><g class="tile t2">
<rect x="1" y="1" width="234" height="168" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect class="glow" x="24" y="24" width="34" height="5" rx="2.5" fill="#218bff"/>
<text x="22" y="94" font-size="50" font-weight="800" fill="url(#num)" letter-spacing="-1">25K+</text>
<text x="24" y="126" font-size="17" font-weight="700" fill="#1f2328">SKU–store combinations</text>
<text x="24" y="150" font-size="14.5" fill="#59636e">CPFR across 300+ stores</text>
</g></g>
<g transform="translate(726 0)"><g class="tile t3">
<rect x="1" y="1" width="234" height="168" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<rect class="glow" x="24" y="24" width="34" height="5" rx="2.5" fill="#1a7f37"/>
<text x="22" y="94" font-size="44" font-weight="800" fill="url(#num)" letter-spacing="-1">h→min</text>
<text x="24" y="126" font-size="17" font-weight="700" fill="#1f2328">reporting prep time</text>
<text x="24" y="150" font-size="14.5" fill="#59636e">Python ETL automation</text>
</g></g>
</svg>
