<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">MULTI-AGENT SYSTEM: Demand → deals → purchase orders</title>
<desc id="desc">MULTI-AGENT SYSTEM. Demand → deals → purchase orders.</desc>
<style>.edge{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
.node{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
.n1{animation-delay:.5s}.n2{animation-delay:1s}.n3{animation-delay:1.5s}.n4{animation-delay:2s}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(.88)}50%{opacity:1;transform:scale(1.1)}}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<rect x="0.5" y="0.5" width="479" height="179" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><rect x="26" y="28" width="30" height="5" rx="2.5" fill="#1a7f37"/><text x="26" y="62" font-size="13.5" font-weight="700" letter-spacing="1.2" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">MULTI-AGENT SYSTEM</text><text x="26" y="108" font-size="27" font-weight="800" fill="#1f2328" letter-spacing="-.4">Demand → deals</text><text x="26" y="142" font-size="27" font-weight="800" fill="#1f2328" letter-spacing="-.4">→ purchase orders</text><g transform="translate(298 14)"><line class="edge" x1="80" y1="24" x2="24" y2="72" stroke="#0969da" stroke-width="1.5"/><line class="edge" x1="80" y1="24" x2="136" y2="72" stroke="#0969da" stroke-width="1.5"/><line class="edge" x1="24" y1="72" x2="52" y2="128" stroke="#0969da" stroke-width="1.5"/><line class="edge" x1="136" y1="72" x2="108" y2="128" stroke="#0969da" stroke-width="1.5"/><line class="edge" x1="52" y1="128" x2="108" y2="128" stroke="#0969da" stroke-width="1.5"/><line class="edge" x1="24" y1="72" x2="136" y2="72" stroke="#0969da" stroke-width="1.5"/><line class="edge" x1="80" y1="24" x2="52" y2="128" stroke="#0969da" stroke-width="1.5"/><circle class="node n0" cx="80" cy="24" r="10" fill="#1a7f37"/><circle class="node n1" cx="24" cy="72" r="8" fill="#0969da"/><circle class="node n2" cx="136" cy="72" r="8" fill="#0969da"/><circle class="node n3" cx="52" cy="128" r="8" fill="#218bff"/><circle class="node n4" cx="108" cy="128" r="8" fill="#218bff"/></g>
