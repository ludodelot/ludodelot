<text clip-path="url(#c0)" x="98" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="25.5" font-weight="700" fill="#1f2328">Business Intelligence Analyst</text><text clip-path="url(#c1)" x="98" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="25.5" font-weight="700" fill="#1f2328">Power BI Developer</text><text clip-path="url(#c2)" x="98" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="25.5" font-weight="700" fill="#1f2328">Data Analyst</text><text clip-path="url(#c3)" x="98" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="25.5" font-weight="700" fill="#1f2328">AI Developer</text>
