<stop offset="0" stop-color="#1f2328"/><stop offset=".42" stop-color="#1f2328"/><stop offset=".5" stop-color="#218bff"/><stop offset=".58" stop-color="#1f2328"/><stop offset="1" stop-color="#1f2328"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.35;1" dur="7s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="barg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#80b8f5"/><stop offset="1" stop-color="#218bff"/></linearGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da" stop-opacity="0"/><stop offset=".5" stop-color="#0969da" stop-opacity=".35"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></linearGradient>
