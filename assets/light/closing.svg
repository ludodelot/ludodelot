<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Let's turn data into decisions</title>
<desc id="desc">Closing banner with a contact line and an animated trend line.</desc>
<style>
.rise{animation:rise .8s cubic-bezier(.2,.8,.3,1) both}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.65}50%{transform:scale(1.15);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1f6fd"/><stop offset="1" stop-color="#dcebfb"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a7f37" stop-opacity=".35"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#c9dcf2" stroke-width=".7" opacity=".55"/></pattern>
<clipPath id="card"><rect width="960" height="200" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="960" height="200" fill="url(#bg)"/><rect x="620" width="340" height="200" fill="url(#grid)" opacity=".8"/></g>
<rect x="0.5" y="0.5" width="959" height="199" rx="18" fill="none" stroke="#d0d7de"/>
<text x="56" y="84" font-size="38" font-weight="800" fill="#1f2328" letter-spacing="-.8">Let's turn data into decisions.</text>
<text x="58" y="122" font-size="17" fill="#59636e">Always happy to talk BI, analytics engineering and AI.</text>
<text x="58" y="158" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1a7f37">❯ <tspan fill="#6e7781">linkedin.com/in/delot</tspan></text>
<rect class="blink" x="282" y="146" width="8" height="15" rx="1" fill="#1a7f37"/>
<g transform="translate(640 60)">
<path d="M0 60 L40 52 L80 56 L120 36 L160 40 L200 22 L240 26 L280 8 V90 H0 Z" fill="url(#area)"/>
<path d="M0 60 L40 52 L80 56 L120 36 L160 40 L200 22 L240 26 L280 8" fill="none" stroke="#1a7f37" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="320">
<animate attributeName="stroke-dashoffset" values="320;0;0" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/></path>
<circle r="4" fill="#1f2328" opacity="0"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M0 60 L40 52 L80 56 L120 36 L160 40 L200 22 L240 26 L280 8"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5s" begin="0s" repeatCount="indefinite"/></circle>
<circle class="pulse" cx="280" cy="8" r="6" fill="#1a7f37"/>
</g>
</svg>
