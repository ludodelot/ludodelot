<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="work icon"><style>
.rise{animation:rise .8s cubic-bezier(.2,.8,.3,1) both}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.65}50%{transform:scale(1.15);opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style><rect x="2" y="2" width="13" height="13" rx="3" fill="#2f81f7"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="17" y="2" width="13" height="13" rx="3" fill="#2f81f7"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect><rect x="2" y="17" width="13" height="13" rx="3" fill="#2f81f7"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect><rect x="17" y="17" width="13" height="13" rx="3" fill="#2da44e"><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/></rect></svg>
